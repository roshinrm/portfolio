<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aqaryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2410c"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#aqaryBg)"/>
  
  <!-- Dashboard mockup -->
  <rect x="50" y="40" width="700" height="370" rx="12" fill="#fff" opacity="0.95"/>
  
  <!-- Header -->
  <rect x="50" y="40" width="700" height="55" rx="12" fill="#fff"/>
  <text x="90" y="75" font-size="22" fill="#c2410c" font-family="Inter, sans-serif" font-weight="700">Aqary</text>
  <text x="160" y="75" font-size="14" fill="#9ca3af" font-family="Inter, sans-serif">Real Estate CRM</text>
  
  <!-- Search bar -->
  <rect x="350" y="52" width="250" height="32" rx="16" fill="#f3f4f6"/>
  <text x="380" y="73" font-size="11" fill="#9ca3af" font-family="Inter, sans-serif">Search properties...</text>
  
  <!-- Filter bar -->
  <rect x="70" y="110" width="80" height="28" rx="14" fill="#fed7aa"/>
  <text x="110" y="129" font-size="10" fill="#c2410c" text-anchor="middle" font-family="Inter, sans-serif">All Types</text>
  
  <rect x="160" y="110" width="70" height="28" rx="14" fill="#f3f4f6"/>
  <text x="195" y="129" font-size="10" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Villa</text>
  
  <rect x="240" y="110" width="90" height="28" rx="14" fill="#f3f4f6"/>
  <text x="285" y="129" font-size="10" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Apartment</text>
  
  <rect x="340" y="110" width="70" height="28" rx="14" fill="#f3f4f6"/>
  <text x="375" y="129" font-size="10" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Office</text>
  
  <!-- Property cards -->
  <!-- Card 1 -->
  <rect x="70" y="155" width="200" height="230" rx="10" fill="#f9fafb"/>
  <rect x="80" y="165" width="180" height="100" rx="8" fill="#fde68a"/>
  <text x="170" y="220" font-size="30" fill="#d97706" text-anchor="middle" font-family="Inter, sans-serif">🏠</text>
  <text x="90" y="285" font-size="12" fill="#1f2937" font-family="Inter, sans-serif" font-weight="600">Marina Bay Villa</text>
  <text x="90" y="305" font-size="10" fill="#6b7280" font-family="Inter, sans-serif">Dubai, UAE</text>
  <text x="90" y="330" font-size="14" fill="#c2410c" font-family="Inter, sans-serif" font-weight="700">AED 4.2M</text>
  <rect x="90" y="350" width="50" height="20" rx="4" fill="#dcfce7"/>
  <text x="115" y="364" font-size="9" fill="#166534" text-anchor="middle" font-family="Inter, sans-serif">For Sale</text>
  
  <!-- Card 2 -->
  <rect x="290" y="155" width="200" height="230" rx="10" fill="#f9fafb"/>
  <rect x="300" y="165" width="180" height="100" rx="8" fill="#bfdbfe"/>
  <text x="390" y="220" font-size="30" fill="#2563eb" text-anchor="middle" font-family="Inter, sans-serif">🏢</text>
  <text x="310" y="285" font-size="12" fill="#1f2937" font-family="Inter, sans-serif" font-weight="600">Business Tower</text>
  <text x="310" y="305" font-size="10" fill="#6b7280" font-family="Inter, sans-serif">Abu Dhabi, UAE</text>
  <text x="310" y="330" font-size="14" fill="#c2410c" font-family="Inter, sans-serif" font-weight="700">AED 12.5M</text>
  <rect x="310" y="350" width="50" height="20" rx="4" fill="#dbeafe"/>
  <text x="335" y="364" font-size="9" fill="#1d4ed8" text-anchor="middle" font-family="Inter, sans-serif">For Rent</text>
  
  <!-- Card 3 -->
  <rect x="510" y="155" width="200" height="230" rx="10" fill="#f9fafb"/>
  <rect x="520" y="165" width="180" height="100" rx="8" fill="#d1fae5"/>
  <text x="610" y="220" font-size="30" fill="#047857" text-anchor="middle" font-family="Inter, sans-serif">🏡</text>
  <text x="530" y="285" font-size="12" fill="#1f2937" font-family="Inter, sans-serif" font-weight="600">Palm Jumeirah</text>
  <text x="530" y="305" font-size="10" fill="#6b7280" font-family="Inter, sans-serif">Dubai, UAE</text>
  <text x="530" y="330" font-size="14" fill="#c2410c" font-family="Inter, sans-serif" font-weight="700">AED 8.9M</text>
  <rect x="530" y="350" width="50" height="20" rx="4" fill="#dcfce7"/>
  <text x="555" y="364" font-size="9" fill="#166534" text-anchor="middle" font-family="Inter, sans-serif">For Sale</text>
</svg>
