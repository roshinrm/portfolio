<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#cfBg)"/>
  
  <!-- Dashboard mockup -->
  <rect x="50" y="40" width="700" height="370" rx="12" fill="#fff" opacity="0.95"/>
  
  <!-- Sidebar -->
  <rect x="50" y="40" width="180" height="370" rx="12" fill="#f3f4f6"/>
  <rect x="50" y="40" width="180" height="60" rx="12" fill="#166534"/>
  <text x="140" y="78" font-size="18" fill="white" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700">ConsumerFed</text>
  
  <!-- Menu items -->
  <rect x="70" y="120" width="140" height="30" rx="6" fill="#16a34a" opacity="0.2"/>
  <text x="140" y="141" font-size="12" fill="#166534" text-anchor="middle" font-family="Inter, sans-serif">Dashboard</text>
  <text x="140" y="181" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Inventory</text>
  <text x="140" y="221" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Sales</text>
  <text x="140" y="261" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Reports</text>
  <text x="140" y="301" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Branches</text>
  
  <!-- Main content area -->
  <!-- Stats cards -->
  <rect x="250" y="60" width="150" height="80" rx="8" fill="#dcfce7"/>
  <text x="325" y="95" font-size="24" fill="#166534" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700">₹2.4M</text>
  <text x="325" y="120" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Total Sales</text>
  
  <rect x="420" y="60" width="150" height="80" rx="8" fill="#fef9c3"/>
  <text x="495" y="95" font-size="24" fill="#854d0e" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700">158</text>
  <text x="495" y="120" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Active Orders</text>
  
  <rect x="590" y="60" width="150" height="80" rx="8" fill="#e0e7ff"/>
  <text x="665" y="95" font-size="24" fill="#3730a3" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700">42</text>
  <text x="665" y="120" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Branches</text>
  
  <!-- Chart area -->
  <rect x="250" y="160" width="320" height="200" rx="8" fill="#f9fafb"/>
  <text x="410" y="185" font-size="12" fill="#374151" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600">Sales Overview</text>
  
  <!-- Simple bar chart -->
  <rect x="280" y="320" width="30" height="30" fill="#16a34a"/>
  <rect x="330" y="280" width="30" height="70" fill="#16a34a"/>
  <rect x="380" y="300" width="30" height="50" fill="#16a34a"/>
  <rect x="430" y="250" width="30" height="100" fill="#16a34a"/>
  <rect x="480" y="270" width="30" height="80" fill="#16a34a"/>
  
  <!-- List area -->
  <rect x="590" y="160" width="150" height="200" rx="8" fill="#f9fafb"/>
  <text x="665" y="185" font-size="12" fill="#374151" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600">Recent Orders</text>
  <rect x="600" y="200" width="130" height="25" rx="4" fill="#fff"/>
  <rect x="600" y="235" width="130" height="25" rx="4" fill="#fff"/>
  <rect x="600" y="270" width="130" height="25" rx="4" fill="#fff"/>
  <rect x="600" y="305" width="130" height="25" rx="4" fill="#fff"/>
</svg>
