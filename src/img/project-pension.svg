<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pensionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#pensionBg)"/>
  
  <!-- Dashboard mockup -->
  <rect x="50" y="40" width="700" height="370" rx="12" fill="#fff" opacity="0.95"/>
  
  <!-- Header -->
  <rect x="50" y="40" width="700" height="55" rx="12" fill="#6d28d9"/>
  <text x="90" y="75" font-size="18" fill="white" font-family="Inter, sans-serif" font-weight="700">Pension Board Portal</text>
  <text x="310" y="75" font-size="12" fill="#c4b5fd" font-family="Inter, sans-serif">Kerala Cooperative Societies</text>
  
  <!-- Stats row -->
  <rect x="70" y="115" width="150" height="70" rx="10" fill="#f5f3ff"/>
  <text x="145" y="145" font-size="22" fill="#6d28d9" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700">12,450</text>
  <text x="145" y="168" font-size="10" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Active Pensioners</text>
  
  <rect x="235" y="115" width="150" height="70" rx="10" fill="#ecfdf5"/>
  <text x="310" y="145" font-size="22" fill="#047857" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700">₹4.2Cr</text>
  <text x="310" y="168" font-size="10" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Monthly Disbursement</text>
  
  <rect x="400" y="115" width="150" height="70" rx="10" fill="#fef3c7"/>
  <text x="475" y="145" font-size="22" fill="#b45309" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700">342</text>
  <text x="475" y="168" font-size="10" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Pending Requests</text>
  
  <rect x="565" y="115" width="150" height="70" rx="10" fill="#dbeafe"/>
  <text x="640" y="145" font-size="22" fill="#1e40af" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700">98</text>
  <text x="640" y="168" font-size="10" fill="#6b7280" text-anchor="middle" font-family="Inter, sans-serif">Societies</text>
  
  <!-- Main content area - Application form preview -->
  <rect x="70" y="200" width="340" height="195" rx="10" fill="#f9fafb"/>
  <text x="90" y="225" font-size="13" fill="#1f2937" font-family="Inter, sans-serif" font-weight="600">New Pension Application</text>
  
  <!-- Form fields -->
  <rect x="85" y="240" width="150" height="30" rx="6" fill="#fff" stroke="#e5e7eb"/>
  <text x="95" y="260" font-size="10" fill="#9ca3af" font-family="Inter, sans-serif">Full Name</text>
  
  <rect x="245" y="240" width="150" height="30" rx="6" fill="#fff" stroke="#e5e7eb"/>
  <text x="255" y="260" font-size="10" fill="#9ca3af" font-family="Inter, sans-serif">Society ID</text>
  
  <rect x="85" y="280" width="150" height="30" rx="6" fill="#fff" stroke="#e5e7eb"/>
  <text x="95" y="300" font-size="10" fill="#9ca3af" font-family="Inter, sans-serif">Aadhaar Number</text>
  
  <rect x="245" y="280" width="150" height="30" rx="6" fill="#fff" stroke="#e5e7eb"/>
  <text x="255" y="300" font-size="10" fill="#9ca3af" font-family="Inter, sans-serif">Bank Account</text>
  
  <rect x="85" y="320" width="150" height="30" rx="6" fill="#fff" stroke="#e5e7eb"/>
  <text x="95" y="340" font-size="10" fill="#9ca3af" font-family="Inter, sans-serif">Retirement Date</text>
  
  <rect x="245" y="320" width="150" height="30" rx="6" fill="#fff" stroke="#e5e7eb"/>
  <text x="255" y="340" font-size="10" fill="#9ca3af" font-family="Inter, sans-serif">Years of Service</text>
  
  <rect x="85" y="360" width="100" height="28" rx="6" fill="#6d28d9"/>
  <text x="135" y="379" font-size="11" fill="white" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500">Submit</text>
  
  <!-- Right side - Recent activity -->
  <rect x="430" y="200" width="285" height="195" rx="10" fill="#f9fafb"/>
  <text x="450" y="225" font-size="13" fill="#1f2937" font-family="Inter, sans-serif" font-weight="600">Recent Approvals</text>
  
  <!-- Activity items -->
  <rect x="445" y="240" width="255" height="40" rx="6" fill="#fff"/>
  <circle cx="465" cy="260" r="12" fill="#d1fae5"/>
  <text x="465" y="264" font-size="10" fill="#047857" text-anchor="middle" font-family="Inter, sans-serif">✓</text>
  <text x="490" y="255" font-size="10" fill="#374151" font-family="Inter, sans-serif">Ramesh K - ₹18,500/month</text>
  <text x="490" y="270" font-size="9" fill="#9ca3af" font-family="Inter, sans-serif">Approved 2 hours ago</text>
  
  <rect x="445" y="290" width="255" height="40" rx="6" fill="#fff"/>
  <circle cx="465" cy="310" r="12" fill="#d1fae5"/>
  <text x="465" y="314" font-size="10" fill="#047857" text-anchor="middle" font-family="Inter, sans-serif">✓</text>
  <text x="490" y="305" font-size="10" fill="#374151" font-family="Inter, sans-serif">Lakshmi S - ₹22,000/month</text>
  <text x="490" y="320" font-size="9" fill="#9ca3af" font-family="Inter, sans-serif">Approved 4 hours ago</text>
  
  <rect x="445" y="340" width="255" height="40" rx="6" fill="#fff"/>
  <circle cx="465" cy="360" r="12" fill="#fef3c7"/>
  <text x="465" y="364" font-size="10" fill="#b45309" text-anchor="middle" font-family="Inter, sans-serif">⏳</text>
  <text x="490" y="355" font-size="10" fill="#374151" font-family="Inter, sans-serif">Vijay M - Under Review</text>
  <text x="490" y="370" font-size="9" fill="#9ca3af" font-family="Inter, sans-serif">Submitted yesterday</text>
</svg>
